<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rewind &mdash; Guess the Year</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0e16">
<meta name="description" content="Rewind: hear a song, guess when it came out, build your timeline. K-Pop and USA hits, on one phone or with everyone on their own.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0e16'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%2322232c'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%2315161d' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23ff4fa0'/%3E%3Ccircle cx='32' cy='32' r='2' fill='%230d0e16'/%3E%3C/svg%3E">
<style>
  :root{
    --ground:#0d0e16;
    --panel:#171a2b;
    --panel-2:#1f2438;
    --line:rgba(255,255,255,.10);
    --ink:#f4f5fb;
    --ink-dim:#a7adc6;
    --ink-faint:#6b7192;
    --good:#25c281;
    --miss:#ff6a5a;
    --m-kpop:#ff4fa0;
    --m-usa:#4d8dff;
    --accent:#9b6bff;
    --accent-ink:#0d0e16;
    --display:"Arial Black","Helvetica Neue Bold","Helvetica Neue",Helvetica,Arial,sans-serif;
    --body:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--ground);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body[data-mode="kpop"]{--accent:var(--m-kpop)}
  body[data-mode="usa"]{--accent:var(--m-usa)}
  button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none;font-size:inherit}
  button:disabled{opacity:.4;cursor:not-allowed}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:14px}
  input{font-family:inherit}
  a{color:inherit}

  .app{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));position:relative}
  .flood{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(120% 70% at 50% -12%, color-mix(in srgb,var(--accent) 38%, transparent), transparent 70%),
      linear-gradient(180deg, color-mix(in srgb,var(--accent) 9%, var(--ground)), var(--ground) 60%);
    transition:background .4s ease}
  .screen{flex:1;display:flex;flex-direction:column;gap:14px;animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* type */
  .display{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.9}
  .eyebrow{color:var(--ink-faint);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .dim{color:var(--ink-dim)}
  .faint{color:var(--ink-faint)}
  .center{text-align:center}
  .small{font-size:13px}
  h2{margin:0}

  /* brand */
  .brand{padding:10px 2px 4px}
  .brand h1{font-family:var(--display);font-weight:900;margin:0;line-height:.86;font-size:clamp(56px,19vw,92px);letter-spacing:-.05em;text-transform:uppercase}
  .brand h1 i{font-style:normal;color:var(--m-kpop)}
  .brand .ko{font-size:15px;color:var(--ink-dim);margin-top:10px}

  /* mode cards */
  .modes{display:flex;flex-direction:column;gap:12px}
  .mode{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 18px 22px;background:var(--panel);
    border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px;
    transition:transform .12s ease}
  .mode:active{transform:scale(.98)}
  .mode .swatch{position:absolute;inset:0 auto 0 0;width:7px;background:var(--mc)}
  .mode .blob{position:absolute;top:-50px;right:-40px;width:150px;height:150px;border-radius:50%;background:var(--mc);opacity:.16;filter:blur(6px)}
  .mode .name{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:-.03em;text-transform:uppercase;color:var(--mc);position:relative;line-height:1}
  .mode .pitch{position:relative;color:var(--ink);font-size:15px;line-height:1.35}
  .mode .meta{position:relative;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line)}

  /* buttons */
  .cta{width:100%;padding:18px;border-radius:20px;background:var(--accent);color:var(--accent-ink);
    font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:.02em;text-transform:uppercase;text-align:center;text-decoration:none;display:block;
    box-shadow:0 12px 30px -12px color-mix(in srgb,var(--accent) 75%,transparent);transition:transform .1s ease}
  .cta:active{transform:translateY(2px) scale(.99)}
  .cta.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .cta .sub{display:block;font-family:var(--body);font-weight:600;text-transform:none;letter-spacing:0;font-size:13px;opacity:.75;margin-top:4px}
  .ghost{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);font-weight:700;font-size:13px}
  .ghost:active{transform:scale(.96)}
  .ghost.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .link{color:var(--accent);font-weight:700;font-size:14px;padding:6px 2px}
  .row{display:flex;gap:10px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1}
  .stack{display:flex;flex-direction:column;gap:10px}
  .bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
  .topback{align-self:flex-start;color:var(--ink-dim);font-weight:700;font-size:14px;padding:6px 2px}

  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
  .seg button{padding:8px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

  /* panels */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
  .card.tint{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
  .rules{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:12px}
  .rules li{counter-increment:r;display:grid;grid-template-columns:30px 1fr;gap:10px;line-height:1.4;font-size:15px}
  .rules li::before{content:counter(r);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    font-family:var(--display);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
  .steps li{font-size:14px}
  .musiccard{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
  .musiccard .ic{font-size:24px}
  .musiccard b{display:block;font-size:15px}

  /* inputs */
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .inp{width:100%;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:17px}
  .inp:focus{outline:none;border-color:var(--accent)}
  .inp.code{font-family:var(--display);font-size:34px;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:12px}
  .err{color:var(--miss);font-size:14px;font-weight:600}
  .ok-t{color:var(--good);font-size:14px;font-weight:700}

  /* players */
  .plist{display:flex;flex-direction:column;gap:8px}
  .p{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700}
  .p .dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
  .p .dot.off{background:var(--ink-faint)}
  .p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p .you{color:var(--ink-faint);font-weight:600;font-size:12px}
  .p .x,.x{color:var(--ink-faint);font-size:20px;line-height:1;padding:0 4px}
  .teambadge{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line)}
  .t0{color:#ffb14a;background:rgba(255,177,74,.12)}
  .t1{color:#6fd3ff;background:rgba(111,211,255,.12)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 14px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:15px}
  .chip[aria-pressed="true"],.chip.pick{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .chip b{font-family:var(--display);margin-left:4px}

  /* game top bar */
  .gtop{display:flex;align-items:center;gap:8px}
  .mchip{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:15px;color:var(--accent);letter-spacing:-.01em}
  .gtop .info{flex:1;color:var(--ink-dim);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:900;color:var(--ink-dim);font-size:16px;flex:none}
  .turn .eyebrow{margin-bottom:4px}
  .capname{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(28px,9vw,40px);line-height:.95;letter-spacing:-.02em;color:var(--accent);word-break:break-word}

  .hint{margin:0;color:var(--ink-dim);font-size:15px;line-height:1.45}
  .hint b{color:var(--ink)}
  .wait{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--ink-dim);font-weight:700;font-size:15px;padding:14px;text-align:center}
  .wait::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite;flex:none}
  @keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

  /* the song stage: YouTube player under a cover until the reveal */
  .stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:22px;background:#05060c;border:1px solid var(--line);overflow:hidden}
  .stage.mini{aspect-ratio:auto;height:150px}
  #ytbox{position:absolute;z-index:3;left:-9999px;top:0;width:320px;height:180px;border-radius:22px;overflow:hidden;background:#000}
  #ytbox:not(.show){left:-9999px!important;top:0!important}
  #ytbox iframe,#ythost{position:absolute;inset:0;width:100%;height:100%;border:0}
  .cover{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 16px 22px;text-align:center;
    background:radial-gradient(110% 95% at 50% 0%,color-mix(in srgb,var(--accent) 38%,#0d0e16),#0d0e16 80%)}
  .cover.off{display:none}
  .ctop{position:absolute;top:10px;left:14px;right:10px;display:flex;align-items:center;gap:8px;min-height:32px}
  .ctop .eyebrow{flex:1;text-align:left;color:var(--ink-dim)}
  .ctime{font-size:12px;font-weight:800;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .cre{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);font-weight:900;color:var(--ink)}
  .vbtn{position:relative;width:88px;height:88px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .vinyl{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle,var(--accent) 0 25%,#0d0e16 26% 28%,transparent 29%),repeating-radial-gradient(circle,#15161d 0 2px,#23242d 2px 4px);
    box-shadow:0 12px 28px -10px #000,0 0 0 2px rgba(255,255,255,.06)}
  .vinyl.spin{animation:spin 2.2s linear infinite}
  .vbtn .vl{position:relative;display:flex;color:var(--accent-ink)}
  .vbtn .vl svg{width:24px;height:24px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.vinyl.spin,.flipic.wob{animation:none}}
  .cmsg{font-weight:800;font-size:16px;max-width:28ch;line-height:1.3}
  .csub{color:var(--ink-dim);font-size:13px;font-weight:600;max-width:32ch;line-height:1.35}
  .cbar{position:absolute;left:14px;right:14px;bottom:10px;height:5px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
  .cbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
  .flipic{width:58px;height:58px;color:var(--accent)}
  .flipic.wob{animation:wob 2.4s ease-in-out infinite}
  @keyframes wob{0%,60%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(10deg)}}
  .minibar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
  .minibar .t{flex:1;min-width:0;font-weight:800;font-size:14px}
  .minibar .t small{display:block;color:var(--ink-dim);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
  .minibar button{width:40px;height:40px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .minibar button svg{width:18px;height:18px}

  /* timeline */
  .tl{display:flex;flex-direction:column}
  .end{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:800;text-align:center;padding:2px}
  .tc{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin:2px 0}
  .tc .yr{font-family:var(--display);font-size:21px;min-width:58px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .tc .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .tc .ti{font-weight:800;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
  .tc .ar{color:var(--ink-dim);font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
  .tc .tag{font-weight:900;font-size:16px;flex:none}
  .tc.good{border-color:color-mix(in srgb,var(--good) 60%,transparent);background:color-mix(in srgb,var(--good) 12%,var(--panel))}
  .tc.bad{border-color:color-mix(in srgb,var(--miss) 60%,transparent);background:color-mix(in srgb,var(--miss) 12%,var(--panel))}
  .tc.bad .yr{color:var(--miss)}
  .tc.bonus{border-color:var(--accent)}
  .tc.mys{border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
  .tg{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 4px;color:var(--accent);font-weight:800;font-size:13px;border-radius:12px}
  .tg::before,.tg::after{content:"";flex:1;border-top:2px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
  .tg:active{background:color-mix(in srgb,var(--accent) 14%,transparent)}

  /* sticky action area */
  .dock{position:sticky;bottom:0;z-index:4;margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:16px 0 max(2px,env(safe-area-inset-bottom));
    background:linear-gradient(to bottom,transparent,var(--ground) 24%)}
  .yearcall{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 8px 6px 14px}
  .step{width:44px;height:44px;border-radius:12px;background:var(--panel-2);font-size:22px;font-weight:900;flex:none}
  .inp.yr{width:92px;flex:none;text-align:center;font-family:var(--display);font-size:22px;padding:8px}

  /* reveal */
  .reveal{border-radius:22px;padding:16px 18px;background:var(--panel);border:2px solid var(--line);display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}
  .reveal .ryear{grid-row:span 2;font-family:var(--display);font-size:46px;line-height:1;color:var(--accent);letter-spacing:-.03em}
  .reveal .rt{font-weight:900;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
  .reveal .ra{color:var(--ink-dim);font-weight:700;font-size:14px;overflow-wrap:anywhere}
  .reveal.ok{border-color:color-mix(in srgb,var(--good) 60%,transparent)}
  .reveal.bad{border-color:color-mix(in srgb,var(--miss) 60%,transparent)}
  .banner{border-radius:20px;padding:14px 16px;text-align:center;font-weight:800;font-size:16px}
  .banner.good{background:color-mix(in srgb,var(--good) 16%,var(--panel));color:var(--good)}
  .banner.bad{background:color-mix(in srgb,var(--miss) 14%,var(--panel));color:var(--miss)}
  .banner.neutral{background:var(--panel);color:var(--ink)}
  .banner .big{display:block;font-family:var(--display);font-size:34px;line-height:1;margin-bottom:4px;text-transform:uppercase;letter-spacing:-.02em}
  .standing{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700}
  .standing .n{font-family:var(--display);width:26px;color:var(--ink-faint)}
  .standing .v{font-family:var(--display);font-size:20px;color:var(--accent)}
  .standing.win{border-color:var(--accent)}

  /* sheet */
  .sheet{position:fixed;inset:0;background:rgba(5,6,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
  .sheet .in{width:100%;max-width:540px;max-height:88dvh;overflow:auto;background:var(--ground);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:20px 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .25s ease both}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{transform:translateY(30px)}}
  .toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;animation:rise .2s ease both;max-width:90vw;text-align:center}
  .netbar{background:color-mix(in srgb,var(--miss) 18%,var(--panel));color:var(--ink);border:1px solid color-mix(in srgb,var(--miss) 45%,transparent);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
  .alt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px}
  .alt small{color:var(--ink-dim);font-weight:600}
  .alt.cur{border-color:var(--accent)}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  .room-code{font-family:var(--display);font-size:clamp(54px,18vw,80px);letter-spacing:.14em;line-height:1;color:var(--accent);text-align:center}
  hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
</style>
</head>
<body>
<div class="flood"></div>
<main class="app" id="app"></main>
<div id="ytbox"><div id="ythost"></div><div class="cover" id="ytcover"></div></div>
<div id="layer"></div>
<script>
/* ---------- SONGS ----------
   One song per line: "year|Artist|Title"
   The year is when that version of the song first came out (album or single, whichever was first).
   An optional 4th field overrides the YouTube search, e.g. "1992|Artist|Title|artist title official audio". */
const SONGS = {};
SONGS.kpop = `1976|Cho Yong-pil|Come Back to Busan Port (돌아와요 부산항에)
1979|Cho Yong-pil|Short Hair (단발머리)
1982|Yoon Soo-il|Apartment (아파트)
1984|Lee Sun-hee|To J (J에게)
1985|Deulgukhwa|That's My World (그것만이 내 세상)
1990|Kim Wan-sun|Pierrot Smiles at Us (삐에로는 우릴 보고 웃지)
1992|Seo Taiji and Boys|Nan Arayo (난 알아요)
1993|Seo Taiji and Boys|Hayeoga (하여가)
1994|Seo Taiji and Boys|Classroom Idea (교실 이데아)
1995|Seo Taiji and Boys|Come Back Home
1993|Kim Gun-mo|Excuse (핑계)
1995|Kim Gun-mo|Wrongful Encounter (잘못된 만남)
1994|Deux|In the Summer (여름 안에서)
1995|Roo'Ra|Angel Who Lost Wings (날개 잃은 천사)

  let h = `<div class="tl"><div class="end">▲ Oldest</div>`;
  for (let p = 0; p <= line.length; p++) {
    if (o.aim === p) h += `<div class="tc mys"><span class="yr">?</span><span class="who"><span class="ti">Mystery song</span><span class="ar">${o.gaps ? "Your pick. Tap another gap to move it" : "Their pick so far"}</span></span></div>`;

      const lbl = !line.length ? "Here" : p === 0 ? `before ${yr(g, line[0])}` : p === line.length ? `after ${yr(g, line[p - 1])}` : `between ${yr(g, line[p - 1])} and ${yr(g, line[p])}`;
      h += `<button class="tg" data-a="aim" data-v="${p}" aria-label="Place it ${lbl}"><span>＋ Here</span></button>`;
    }
    if (o.res && !o.res.ok && o.res.pos === p) h += songCard(g, o.res.song, "bad", "✗");

    }
  }
  return h + `<div class="end">▼ Newest</div></div>`;
}

/* ---------- a turn ---------- */
function gameView() {
  const g = S.g, s = side(g), name = sideName(g, s), me = mySide(s);
  const you = ROLE !== "pass" && s.ids.includes(ME);
  const who = g.play === "coop" ? "Your timeline" : you ? (g.play === "teams" ? esc(name) + " (you)" : "Your turn") : esc(name) + (g.play === "teams" ? "" : "'s turn");
  let h = topbar(scoreLine(g)) + `<div class="turn"><div class="eyebrow">Song ${g.turn}</div><div class="capname">${who}</div></div>`;

  if (g.phase === "listen") {
    // the music phone shows the song first; the timeline comes after "Place it"
    const placing = U.placing === turnKey(g) || (ROLE === "guest" && me);
    if (isHostDevice() && !placing) {
      h += `<div class="stage" id="stage"></div>`;
      if (me) h += `<div class="dock"><button class="cta" data-a="goPlace">Place it</button></div>`;
      else h += `<div class="dock">${wait(`${esc(name)} is placing the song on their phone`)}</div>`;
      return h;
    }
    if (me) {
      if (isHostDevice()) h += `<div class="minibar" id="mini"></div>`;
      h += timeline(g, s.line, { gaps: true, aim: g.aim });
      h += lockDock(g);
      return h;
    }
    // someone else is placing: watch their timeline
    h += `<div class="stage mini"><div class="cover"><div class="vbtn"><span class="vinyl spin"></span></div><div class="cmsg">Playing on ${esc(nm(S.hostId))}'s phone</div></div></div>`;
    h += `<p class="hint"><b>${esc(name)}</b> is placing it. Shout your advice!</p>` + timeline(g, s.line, { aim: g.aim });
    return h;
  }

  // reveal: the real video (on the music phone), the answer, one button
  const r = g.res, sg = song(g.type, r.song), done = gameDone(g);
  h += isHostDevice() ? `<div class="stage" id="stage"></div>` : "";
  h += `<div class="reveal ${r.ok ? "ok" : "bad"}"><div class="ryear">${sg.y}</div><div class="rt">${esc(sg.t)}</div><div class="ra">${esc(sg.a)}</div></div>`;
  let big, sub;
  if (r.exact) {
    big = "Spot on!";
    sub = r.life > 0 ? "Right place and the exact year: +1 ❤️" : r.extra != null ? `Exact year! Bonus song: ${song(g.type, r.extra).t} (${yr(g, r.extra)})` : "Right place and the exact year";
  } else if (r.ok) {
    big = "Right!"; sub = (g.play === "coop" ? "It joins your timeline" : `${name} keeps it`) + (r.call != null ? ` · the year guess was ${r.call}` : "");
  } else {
    big = "Not quite"; sub = `It came out in ${sg.y}` + (r.life < 0 ? " · −1 ❤️" : "");
  }
  h += `<div class="banner ${r.ok ? "good" : "bad"}"><span class="big">${big}</span>${esc(sub)}</div>`;
  if (isHostDevice() && Music.cache[Music.ck] && (Music.cache[Music.ck].alts || []).length > 1) h += `<button class="link" data-a="alts" style="align-self:center">Wrong video? Pick another</button>`;
  const next = g.sides[(g.at + 1) % g.sides.length];
  h += `<div class="dock"><button class="cta" data-a="next">${done ? "See results" : g.play === "coop" ? "Next song" : `Next: ${esc(sideName(g, next))}`}</button></div>`;
  h += `<div class="eyebrow">${g.play === "coop" ? "Your timeline" : esc(name) + "'s timeline"} · ${s.line.length}/${g.goal}</div>` + timeline(g, s.line, { res: r });
  return h;
}
function lockDock(g) {
  let h = `<div class="dock">`;
  if (g.bonus && g.aim != null) {
    const [lo, hi] = yearRange(g, g.aim);
    if (!U.yrOn) h += `<button class="ghost" data-a="yrOn">🎯 Bonus: call the exact year</button>`;
    else h += `<div class="yearcall"><span class="eyebrow grow">Exact year</span>
        <button class="step" data-a="yr" data-v="-1" aria-label="A year earlier">−</button>
        <input class="inp yr" id="yearcall" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(U.drafts.yearcall ?? "")}" aria-label="Exact year, ${lo} to ${hi}">
        <button class="step" data-a="yr" data-v="1" aria-label="A year later">+</button>
        <button class="x" data-a="yrOff" aria-label="Skip the year bonus">×</button></div>
      <div class="faint small center">Somewhere from ${lo} to ${hi}</div>`;
  }
  h += `<button class="cta" data-a="lock" ${g.aim == null ? "disabled" : ""}>${g.aim == null ? "Tap a gap first" : "Lock it in"}</button></div>`;
  return h;
}

/* ---------- game over ---------- */
function overView() {
  const g = S.g, m = MODES[S.mode];
  let head, sub, good = true, line = null, rows = "";
  if (g.play === "coop") {
    const s = g.sides[0], won = s.line.length >= g.goal;
    good = won; head = won ? "You did it!" : g.out ? "Out of songs" : "Out of lives";
    sub = `${s.line.length} song${s.line.length === 1 ? "" : "s"} in your timeline`; line = s.line;
  } else {
    const st = g.sides.map((s, i) => ({ i, n: s.line.length })).sort((a, b) => b.n - a.n), top = st[0];
    const tie = st.length > 1 && st[1].n === top.n;
    head = tie ? "It's a tie!" : `${sideName(g, g.sides[top.i])} wins!`;
    sub = (g.out ? "We ran out of songs. " : "") + `${top.n} song${top.n === 1 ? "" : "s"} in the timeline`;
    if (!tie) line = g.sides[top.i].line;
    rows = `<div class="stack">${st.map((r, k) => `<div class="standing ${k === 0 && !tie ? "win" : ""}"><span class="n">${k + 1}</span><span class="grow">${esc(sideName(g, g.sides[r.i]))}</span><span class="v">${r.n}</span></div>`).join("")}</div>`;
  }
  const host = isHostDevice();
  return `<section class="screen">
    <div class="center"><span class="mchip">${m.name}</span></div>
    <div class="banner ${good ? "good" : "bad"}"><span class="big">${esc(head)}</span>${esc(sub)}</div>
    ${rows}
    ${line ? `<div class="eyebrow">${g.play === "coop" ? "Your timeline" : "Winning timeline"}</div>${timeline(g, line, {})}` : ""}
    <div class="dock">
      ${host ? `<button class="cta" data-a="again">Play ${m.name} again</button>
                <button class="cta alt" data-a="${ROLE === "pass" ? "changeGame" : "lobby"}">${ROLE === "pass" ? "Pick another playlist" : "Back to the lobby"}</button>`
             : wait(`Waiting for ${esc(nm(S.hostId))} to pick what's next`)}
      ${ROLE === "guest" ? `<button class="link" data-a="leave">Leave room</button>` : ""}
    </div>
  </section>`;
}

      <li><span>Go to <b>APIs &amp; Services → Library</b>, search <b>YouTube Data API v3</b> and tap <b>Enable</b>.</span></li>
      <li><span>Go to <b>APIs &amp; Services → Credentials → Create credentials → API key</b> and copy the key.</span></li>
      <li><span>Recommended: edit the key, choose <b>Websites</b> and add <b>${esc(origin)}/*</b>, then limit it to the YouTube Data API v3.</span></li>
    </ol>
    <div class="field"><label for="ytkey">Your API key</label><input class="inp" id="ytkey" autocomplete="off" spellcheck="false" placeholder="AIza…" value="${esc(U.drafts.ytkey ?? Music.key)}"></div>
    ${km ? `<div class="${km.ok ? "ok-t" : "err"}">${esc(km.text)}</div>` : ""}
    <div class="row"><button class="cta grow" data-a="keySave">Save &amp; test</button>${Music.key ? `<button class="ghost" data-a="keyClear">Remove</button>` : ""}</div>
    <div class="faint small" style="line-height:1.45">The key is saved only in this browser and only ever sent to Google. Each new song uses one search; the free daily limit covers about 100 new songs a day, and songs you've heard before are remembered (${saved} saved).</div>
    ${saved ? `<button class="link" data-a="forgetVids" style="align-self:flex-start">Forget saved videos</button>` : ""}
    <button class="link" data-a="close">Done</button>`;
}
function sheetView() {
  const s = U.sheet; if (!s) return "";
  let inner = "";
  if (s.k === "rules") {
    inner = `<div class="display" style="font-size:34px;color:${MODES[s.mode].color}">How to play</div>${rulesBlock()}<button class="cta" data-a="close">Got it</button>`;
  } else if (s.k === "menu") {
    const g = S && S.g, playing = g && S.stage === "play";
    const off = ROLE === "host" && playing ? g.roster.filter(p => p !== ME) : [];
    inner = `<div class="eyebrow">Menu</div>
      ${playing ? `<button class="cta alt" data-a="lines">See all timelines</button>` : ""}
      <button class="cta alt" data-a="rules">How to play</button>
      ${isHostDevice() ? `<button class="cta alt" data-a="musicSetup">Music setup</button>` : ""}
      ${isHostDevice() && playing && g.phase === "listen" ? `<button class="cta alt" data-a="skip">Skip this song</button>` : ""}
      ${S.play === "room" ? `<button class="cta alt" data-a="share">Share invite link (${esc(S.code)})</button>` : ""}
      ${off.length ? `<div class="eyebrow">Remove a player from this game</div><div class="chips">${off.map(p => `<button class="chip" data-a="drop" data-v="${p}">${online(p) ? "" : "⚪ "}${esc(nm(p))}</button>`).join("")}</div>` : ""}
      ${ROLE === "pass" ? `<button class="cta alt" data-a="endPass">End game</button>` : ""}
      ${ROLE === "host" ? `<button class="cta alt" data-a="lobby">End game, back to lobby</button><button class="cta alt" data-a="closeRoom">Close the room</button>` : ""}
      ${ROLE === "guest" ? `<button class="cta alt" data-a="leave">Leave room</button>` : ""}
      <button class="link" data-a="close">Close</button>`;
  } else if (s.k === "lines") {
    const g = S.g;
    inner = `<div class="eyebrow">Timelines</div>${g.sides.map(sd => `<div class="row"><span class="display grow" style="font-size:24px;color:var(--accent)">${esc(sideName(g, sd))}</span><span class="faint small">${sd.line.length}/${g.goal}</span></div>${timeline(g, sd.line, {})}`).join(`<hr class="sep">`)}
      <button class="link" data-a="close">Close</button>`;
  } else if (s.k === "modes") {
    inner = `<div class="eyebrow">Pick a playlist</div><div class="modes">${Object.keys(MODES).map(k => modeCard(k).replace('data-a="pick"', 'data-a="setMode"')).join("")}</div>
      <button class="link" data-a="close">Cancel</button>`;
  } else if (s.k === "music") {
    inner = musicSheet();
  } else if (s.k === "alts") {
    const c = Music.cache[Music.ck] || { alts: [] };
    inner = `<div class="eyebrow">Pick the right video</div>${c.alts.map(v => `<button class="alt ${v.id === Music.vid ? "cur" : ""}" data-a="useAlt" data-v="${esc(v.id)}">${esc(v.t)}<small>${esc(v.c)} · ${fmt(v.d)}${(c.bad || []).includes(v.id) ? " · didn't play" : ""}</small></button>`).join("")}
      <div class="faint small">Your pick is remembered for next time.</div><button class="link" data-a="close">Cancel</button>`;
  } else if (s.k === "ytm") {
    const g = S && S.g, sg = g && g.cur != null ? song(g.type, g.cur) : null;
    inner = `<div class="q" style="font-size:22px;font-weight:800">Play it in YouTube Music</div>
      <div class="dim" style="line-height:1.45">This opens the song by name, so it gives the answer away. Hand the phone to someone who isn't guessing, or flip it over once it plays.</div>
      ${sg ? `<a class="cta" href="https://music.youtube.com/search?q=${encodeURIComponent(sg.a + " " + sg.t)}" target="_blank" rel="noopener" data-a="close">Open YouTube Music</a>` : ""}
      <button class="cta alt" data-a="close">Cancel</button>`;
  } else if (s.k === "ask") {
    inner = `<div class="q" style="font-size:22px;font-weight:800">${esc(s.text)}</div>
      <button class="cta" data-a="${s.then}" ${s.v ? `data-v="${esc(s.v)}"` : ""}>${esc(s.yes)}</button>
      <button class="cta alt" data-a="close">Cancel</button>`;
  }
  return `<div class="sheet" data-a="scrim"><div class="in" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ================= render ================= */
function view() {
  if (!S) return ({ home: homeView, mode: modeView, setup: setupView, host: hostView, join: joinView, connecting: connectingView }[U.screen] || homeView)();
  if (S.stage === "lobby") return lobbyView();
  if (S.stage === "over") return overView();
  return `<section class="screen">${gameView()}</section>`;
}
let lastKey = "";
function render() {
  const mode = (S && S.mode) || (U.screen !== "home" && U.screen !== "join" ? U.pick : "") || "";
  document.body.dataset.mode = mode;
  const g = S && S.stage === "play" && S.g;
  if (g) {
    const tk = turnKey(g) + g.phase;           // a new turn starts without a year guess
    if (U.yrKey !== tk) { U.yrKey = tk; U.yrOn = false; delete U.drafts.yearcall; }
  }
  const ae = document.activeElement;
  const keep = ae && ae.id && ae.tagName === "INPUT" ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  // only animate the screen when the "page" actually changes
  const key = S ? [S.stage, g && g.phase, g && g.turn, g && U.placing === turnKey(g)].join("|") : U.screen + U.pick;
  app.innerHTML = view();
  if (key === lastKey) app.querySelectorAll(".screen").forEach(el => el.style.animation = "none");
  lastKey = key;
  layer.innerHTML = sheetView();
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  musicSync();
  if (S && S.stage === "over" && !U.cele) {
    U.cele = true; const og = S.g;
    if (og.play !== "coop" || og.sides[0].line.length >= og.goal) confetti();
  }
  if (!S || S.stage !== "over") U.cele = false;
}

/* ================= toast + confetti ================= */
let toastT;
function toast(msg) {
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#ff4fa0", "#f5b301", "#4d8dff", "#25c281", "#9b6bff"];
  const P = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, c: cols[rnd(5)] }));
  let f = 0;
  (function tickC() {
    x.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += .15; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 150) requestAnimationFrame(tickC); else c.remove();
  })();
}

/* ================= input handling ================= */
function inviteLink() {
  const u = new URL(location.href); u.search = ""; u.hash = "";
  u.searchParams.set("room", S.code);
  ["net", "peerhost"].forEach(k => { if (params.get(k)) u.searchParams.set(k, params.get(k)); });
  return u.toString();
}
async function share() {
  const url = inviteLink();
  try {
    if (navigator.share) { await navigator.share({ title: "Rewind", text: `Join my Rewind room: ${S.code}`, url }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast("Invite link copied"); }
  catch (e) { prompt("Copy this link:", url); }
}
function addName() {
  const n = cleanName(U.drafts.newname);
  if (!n) return;
  if (U.pp.some(p => p.name.toLowerCase() === n.toLowerCase())) { toast(n + " is already playing"); return; }
  const t0 = U.pp.filter(p => !p.team).length;
  U.pp.push({ id: uid(), name: n, team: t0 > U.pp.length - t0 ? 1 : 0 });
  U.drafts.newname = ""; render();
  const el = $("#newname"); if (el) el.focus();
}
async function createRoom() {
  const name = cleanName(U.drafts.hostname ?? U.name);
  if (!name) { U.err = "Enter your name first."; render(); return; }
  U.name = name; store.set("rewind-name", name);
  U.err = ""; U.net = "Opening a room…"; U.screen = "connecting"; render();
  const tok = U.conn = (U.conn || 0) + 1;
  try {
    const code = await hostRoom(newCode());
    if (tok !== U.conn) { try { Net.peer.destroy(); } catch (e) {} Net.peer = null; return; }
    ROLE = "host"; ME = uid();
    S = { v: 0, play: "room", code, mode: U.pick, hostId: ME, stage: "lobby", sets: JSON.parse(JSON.stringify(U.sets)), teamNames: U.teamNames.slice(),
          players: [{ id: ME, name, team: 0, on: true }], g: null };
    commit();
  } catch (e) { if (tok !== U.conn) return; U.screen = "host"; U.err = e.message; render(); }
}
async function doJoin(code, name) {
  U.err = ""; U.net = `Joining room ${code}…`; U.screen = "connecting"; render();
  const tok = U.conn = (U.conn || 0) + 1;
  try {
    await joinRoom(code, name);
    if (tok !== U.conn) { goHome(); return; }
    ROLE = "guest"; U.screen = "home";
    store.set("rewind-save", { role: "guest", code, mode: S && S.mode, t: Date.now() });
    render();
  } catch (e) { if (tok !== U.conn) return; U.screen = "join"; U.err = e.message; render(); }
}
async function resume() {
  const sv = store.get("rewind-save", null); if (!sv) return;
  if (sv.role === "pass") { ROLE = "pass"; ME = null; S = sv.S; render(); return; }
  if (sv.role === "guest") { U.joinCode = sv.code; return doJoin(sv.code, U.name || "Player"); }
  U.net = `Reopening room ${sv.S.code}…`; U.screen = "connecting"; render();
  try {
    await hostRoom(sv.S.code, true);
    ROLE = "host"; ME = sv.me; S = sv.S;
    S.players.forEach(p => p.on = p.id === ME);
    commit();
  } catch (e) { U.screen = "home"; render(); toast(e.message); }
}
async function saveKey() {
  const k = String(U.drafts.ytkey ?? Music.key).trim();
  if (!/^[\w-]{20,60}$/.test(k)) { U.keyMsg = { ok: false, text: "That doesn't look like an API key. They start with AIza and are about 39 characters." }; render(); return; }
  U.keyMsg = { ok: true, text: "Testing…" }; render();
  try {
    await ytFetch("videos", { part: "id", id: "9bZkp7q19f0" }, k);   // costs 1 unit of the daily quota
    Music.key = k; store.set("rewind-ytkey", k); delete U.drafts.ytkey;
    U.keyMsg = { ok: true, text: "Connected! Songs will play on this phone." };
    if (Music.st === "nokey" || Music.st === "error") Music.song = null;   // look the current song up again
  } catch (e) { U.keyMsg = { ok: false, text: e.message }; }
  render();
}

document.addEventListener("input", e => {
  const t = e.target; if (!t.id) return;
  if (t.id === "joincode") t.value = t.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (t.id === "yearcall") t.value = t.value.replace(/\D/g, "").slice(0, 4);
  U.drafts[t.id] = t.value;
});
document.addEventListener("change", e => { if (/^tn-[01]$/.test(e.target.id || "")) commitTeamNames(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.id) return;
  const id = e.target.id;
  if (/^tn-[01]$/.test(id)) { e.target.blur(); return; }
  if (id === "newname") addName();
  else if (id === "hostname") createRoom();
  else if (id === "joincode" || id === "joinname") handle("joinRoom");
  else if (id === "yearcall") handle("lock");
  else if (id === "ytkey") handle("keySave");
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  if (el.dataset.a === "scrim" && e.target !== el) return;
  handle(el.dataset.a, el.dataset.v, el);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && U.sheet) { U.sheet = null; render(); } });

function ask(text, yes, then, v) { U.sheet = { k: "ask", text, yes, then, v }; render(); }
function handle(a, v, el) {
  switch (a) {
    /* ---- local navigation ---- */
    case "home": U.conn = (U.conn || 0) + 1; U.screen = "home"; U.err = ""; render(); scrollTo(0, 0); return;
    case "pick": U.pick = v; U.screen = "mode"; U.err = ""; render(); scrollTo(0, 0); return;
    case "goSetup": U.screen = "setup"; render(); scrollTo(0, 0); return;
    case "goHost": U.screen = "host"; U.err = ""; render(); scrollTo(0, 0); return;
    case "goJoin": U.screen = "join"; U.err = ""; render(); return;
    case "addName": addName(); return;
    case "tnRoll": {
      const names = drawTeamNames([0, 1].map(teamName));
      delete U.drafts["tn-0"]; delete U.drafts["tn-1"];
      if (S) act({ type: "teamNames", val: names });
      else { U.teamNames = names; store.set("rewind-teamnames", names); render(); }
      return;
    }
    case "rmName": U.pp = U.pp.filter(p => p.id !== v); render(); return;
    case "shuffleTeams": if (!S) { splitTeams(U.pp); render(); } else act({ type: "shuffleTeams" }); return;
    case "swapTeam": { const p = U.pp.find(p => p.id === v); if (p) p.team = p.team ? 0 : 1; render(); return; }
    case "startPass": {
      if (startProblem(U.pick, U.sets[U.pick], U.pp)) return;
      commitTeamNames();
      ROLE = "pass"; ME = null;
      S = { v: 0, play: "pass", code: null, mode: U.pick, hostId: null, stage: "lobby", sets: JSON.parse(JSON.stringify(U.sets)), teamNames: U.teamNames.slice(),
            players: U.pp.map(p => ({ id: p.id, name: p.name, team: p.team || 0, on: true })), g: null };
      startGame(); commit(); scrollTo(0, 0); return;
    }
    case "createRoom": createRoom(); return;
    case "joinRoom": {
      const code = String(U.drafts.joincode ?? U.joinCode).toUpperCase(), name = cleanName(U.drafts.joinname ?? U.name);
      if (code.length !== 4) { U.err = "Room codes are 4 letters."; render(); return; }
      if (!name) { U.err = "Enter your name."; render(); return; }
      U.joinCode = code; U.name = name; store.set("rewind-name", name);
      doJoin(code, name); return;
    }
    case "resume": resume(); return;
    case "reconnect": reconnect(false); return;
    case "share": share(); return;
    case "rules": U.sheet = { k: "rules", mode: (S && S.mode) || U.pick || "kpop" }; render(); return;
    case "menu": U.sheet = { k: "menu" }; render(); return;
    case "lines": U.sheet = { k: "lines" }; render(); return;
    case "modePick": U.sheet = { k: "modes" }; render(); return;
    case "close": case "scrim": U.sheet = null; U.keyMsg = null; render(); return;
    case "leave": ask("Leave this room?", "Leave", "yesLeave"); return;
    case "closeRoom": ask("Close the room for everyone?", "Close room", "yesClose"); return;
    case "endPass": ask("End this game?", "End game", "yesEnd"); return;
    case "yesLeave": case "yesClose": goHome(); return;
    case "yesEnd": { const k = S.mode; goHome(); U.pick = k; U.screen = "mode"; render(); return; }
    case "changeGame": goHome(); return;

    /* ---- music (this phone only) ---- */
    case "musicSetup": U.keyMsg = null; U.sheet = { k: "music" }; render(); return;
    case "keySave": saveKey(); return;
    case "keyClear": Music.key = ""; store.del("rewind-ytkey"); delete U.drafts.ytkey; U.keyMsg = null; render(); return;
    case "forgetVids": Music.cache = {}; saveCache(); toast("Forgot saved videos"); render(); return;
    case "mToggle": musicToggle(); return;
    case "mReplay": musicReplay(); return;
    case "mRetry": if (Music.ck) { delete Music.cache[Music.ck]; saveCache(); } Music.song = null; render(); return;
    case "flipOn": armFlip(); return;
    case "ytm": U.sheet = { k: "ytm" }; render(); return;
    case "alts": U.sheet = { k: "alts" }; render(); return;
    case "useAlt": {
      const c = Music.cache[Music.ck], alt = c && c.alts.find(x => x.id === v);
      U.sheet = null;
      if (alt && Music.ready) { c.id = alt.id; c.d = alt.d; saveCache(); cue(alt, true); }
      render(); return;
    }

    /* ---- pass-mode settings before a game exists ---- */
    case "set":
      if (!S) {
        const val = coerce(el.dataset.k, v); if (val === undefined) return;
        U.sets[U.pick][el.dataset.k] = val; store.set("rewind-sets", U.sets); render(); return;
      }
      act({ type: "set", k: el.dataset.k, v }); return;
    case "era":
      if (!S) {
        const set = U.sets[U.pick];
        if (set.eras.includes(v)) { if (set.eras.length > 1) set.eras = set.eras.filter(e => e !== v); else toast("Keep at least one era"); }
        else set.eras = MODES[U.pick].eras.map(e => e[0]).filter(e => e === v || set.eras.includes(e));
        store.set("rewind-sets", U.sets); render(); return;
      }
      act({ type: "era", v }); return;

    /* ---- a turn ---- */
    case "goPlace": U.placing = turnKey(S.g); render(); scrollTo(0, 0); return;
    case "aim": {
      const g = S.g, p = Number(v);
      if (ROLE === "guest") { g.aim = p; render(); }     // show the pick right away; the host's copy follows
      if (U.yrOn) {
        const [lo, hi] = yearRange(g, p), y = Number(U.drafts.yearcall);
        if (!(y >= lo && y <= hi)) U.drafts.yearcall = String(Math.round((lo + hi) / 2));
      }
      act({ type: "aim", v: p }); return;
    }
    case "yrOn": {
      const [lo, hi] = yearRange(S.g, S.g.aim);
      U.yrOn = true; U.drafts.yearcall = String(Math.round((lo + hi) / 2)); render();
      const el2 = $("#yearcall"); if (el2) el2.focus({ preventScroll: true });
      return;
    }
    case "yrOff": U.yrOn = false; delete U.drafts.yearcall; render(); return;
    case "yr": {
      const [lo, hi] = yearRange(S.g, S.g.aim), cur = Number(U.drafts.yearcall);
      U.drafts.yearcall = String(clamp((Number.isInteger(cur) && cur ? cur : Math.round((lo + hi) / 2)) + Number(v), lo, hi)); render(); return;
    }
    case "lock": {
      const g = S.g; if (!g || g.aim == null || g.phase !== "listen") return;
      let year = null;
      if (U.yrOn && g.bonus) {
        const [lo, hi] = yearRange(g, g.aim), y = Number(U.drafts.yearcall);
        if (!Number.isInteger(y) || y < lo || y > hi) { toast(`Pick a year from ${lo} to ${hi}, or tap × to skip the bonus`); return; }
        year = y;
      }
      act({ type: "place", year }); scrollTo(0, 0); return;
    }
    case "skip": U.sheet = null; ask("Skip this song? Nobody loses anything.", "Skip song", "yesSkip"); return;
    case "yesSkip": U.sheet = null; act({ type: "skip" }); return;

    /* ---- game actions (go through the host) ---- */
    case "setMode": U.sheet = null; act({ type: "setMode", v }); return;
    case "drop": ask(`Remove ${nm(v)} from this game?`, "Remove", "yesDrop", v); return;
    case "yesDrop": U.sheet = null; act({ type: "drop", v }); return;
    case "lobby": U.sheet = null; act({ type: "lobby" }); return;
    case "next": case "again": case "start": act({ type: a, v }); scrollTo(0, 0); return;
    default: act({ type: a, v });
  }
}

/* ================= boot ================= */
// test hook: lets automated checks read state (harmless in normal play)
window.__rewind = { get S() { return S; }, get ME() { return ME; }, get ROLE() { return ROLE; }, Music, Flip };
render();
// reloaded a tab that was already in this room? slip straight back in
if (U.joinCode && tabStore.get("rewind-pid-" + U.joinCode) && U.name) doJoin(U.joinCode, U.name);
})();
</script>
